name: CI

on:
  push:
    branches: [solution]
  pull_request:
    branches: [solution]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PATH: todos.db
      JWT_SECRET: ci-only-secret-with-at-least-32-bytes
      NEXT_TELEMETRY_DISABLED: "1"
      RP_NAME: Todo App
      RP_ID: localhost
      RP_ORIGIN: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: npm run test:e2e -- --config=playwright.frontend.config.ts

      - name: Build production app
        run: npm run build
